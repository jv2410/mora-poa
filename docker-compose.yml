services:
  db:
    image: postgres:16-alpine
    container_name: imoveis-db
    environment:
      POSTGRES_USER: imoveis
      POSTGRES_PASSWORD: imoveis
      POSTGRES_DB: imoveis
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imoveis -d imoveis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
